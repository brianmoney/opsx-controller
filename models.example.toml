# Example opsx-controller model configuration.
#
# Copy this file to one of:
#   ~/.config/opsx-controller/models.toml   (primary, user-global)
#   <repo>/.opsx-plan/models.toml           (machine-local override, gitignored)
#
# `opsx-plan models init` seeds the user-global file from your current
# environment. Resolution precedence, highest first:
#   1. [adapters.<adapter>].<role>  in the repo-local file
#   2. [adapters.<adapter>].<role>  in the user-global file
#   3. [defaults].<role>            in the repo-local file, then user-global
#   4. the ambient OPSX_<ROLE>_MODEL environment variable
#   5. unresolved (the run fails closed)
#
# Roles: controller, implementer, reviewer, archiver (all required).
#        implementer_escalation (optional, used by escalate_after_review_fails).
#        supervisor, supervised_author, acceptance_reviewer, fixer, verifier
#        (optional supervised roles; inert until the supervision enforcement
#        changes land, so defining none of them behaves exactly as before).
#
# The four supervised roles with concrete OpenCode agents — supervisor,
# acceptance_reviewer, fixer, verifier — are installed by the OpenCode adapter
# only when their model is resolved. On a machine that configures none of them,
# installation leaves the legacy agents byte-identical and reports the
# supervised agents as unconfigured. `bash adapters/opencode/install.sh
# --global --verify` re-renders each supervised agent from source with the
# current environment and reports any missing or differing installed file by
# name, alongside the existing plan-authoring reference, plugin, and supervised
# service-tool shim checks. The adapter also deploys the tracked worker shell
# wrapper `opsx-worker-exec`, which each worker role's `bash` permission allows
# as its only command: an unjournaled model client, an agent runner, a nested
# shell, or a shell indirection through it is refused and recorded as a
# `policy_violation` incident rather than executed.
#
# Supervised jobs additionally use an operator-maintained inexpensive-model
# allowlist in the `[allowlist]` table, with the same file precedence as
# roles and no environment source:
#
#   [allowlist]
#   models = ["deepseek/deepseek-v4-flash", "moonshotai/kimi-k2"]
#
# A repo-local `[allowlist].models` replaces the user-global list wholesale
# (lists never merge). The allowlist is never consulted for legacy,
# unsupervised runs. `opsx-plan models show` prints it and each supervised
# dispatch role's membership.
#
# Optional reasoning variants: a `<role>_variant` key uses the canonical
# effort labels `low`, `medium`, `high`, or `max`. Each adapter translates
# them to its harness vocabulary. When unset, the adapter keeps its built-in
# default (OpenCode reviewer: xhigh, other OpenCode roles: high). Re-run the
# adapter install script after changing a variant.
#
# Resolved variants are also passed through to direct plan dispatch
# (`opsx-plan run`): the OpenCode stage invokes append
# `--variant "$OPSX_<ROLE>_VARIANT"` and the orchestrator exports that
# variable per role, dropping the flag entirely when a role has no variant
# configured so the client's built-in default applies.
#
# `controller_variant` is also honored by `opsx-plan compile`: OpenCode
# compilation appends `opencode run --variant <variant>` when the controller
# role resolves a variant, and omits the flag entirely when it does not.
# Claude Code compilation ignores the controller variant (the Claude CLI has
# no reasoning-variant flag) — documented behavior, not an error.
#
# Identifier syntax is adapter-specific:
#   - opencode requires "provider/model" (e.g. "deepseek/deepseek-v4-pro")
#   - claude-code requires a bare Anthropic alias (e.g. "claude-sonnet-5")
#   - codex-cli requires a bare OpenAI id (e.g. "gpt-5.4")
#   - dsh requires "provider/model" (e.g. "deepseek/deepseek-v4-pro")
# `opsx-plan doctor` and `opsx-plan models show` flag identifiers that don't
# match the target adapter's syntax.

[defaults]
controller = "github-copilot/gpt-5.4"
implementer = "deepseek/deepseek-v4-pro"
# implementer_escalation = "deepseek/deepseek-v4-ultra"  # optional, uncomment to enable escalation
reviewer = "github-copilot/gpt-5.4"
archiver = "github-copilot/gpt-5.4"

[adapters.opencode]
controller = "github-copilot/gpt-5.4"
implementer = "deepseek/deepseek-v4-pro"
# implementer_escalation = "deepseek/deepseek-v4-ultra"  # optional, for escalate_after_review_fails
reviewer = "github-copilot/gpt-5.4"
# reviewer_variant = "max"
archiver = "github-copilot/gpt-5.4"

[adapters.claude-code]
implementer = "claude-sonnet-5"
# implementer_escalation = "claude-opus-5"  # optional
reviewer = "claude-opus-5"
archiver = "claude-sonnet-5"

[adapters.codex-cli]
implementer = "gpt-5.4"
# implementer_escalation = "gpt-5.4-pro"  # optional
reviewer = "gpt-5.4"
archiver = "gpt-5.4"

[adapters.dsh]
implementer = "deepseek/deepseek-v4-pro"
# implementer_escalation = "deepseek/deepseek-v4-ultra"  # optional
reviewer = "deepseek/deepseek-v4-pro"
archiver = "deepseek/deepseek-v4-pro"

# The inexpensive-model allowlist shared by all adapters (optional; only used
# by supervised jobs). Uncomment and edit to register supervised models.
# [allowlist]
# models = ["deepseek/deepseek-v4-flash", "moonshotai/kimi-k2"]
